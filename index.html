<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boat lift 3D model</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
:root{
  --paper:#F3EBD3; --shoal:#CFE6E4; --channel:#0E3A53; --ink:#1C2B33; --muted:#52656E;
  --mark:#A8136F; --line:#C9BD9A; --panel:#FBF6E6; --btn:#EDE3C6; --sky1:#DDEDEE; --sky2:#F3EBD3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10222C; --shoal:#16465A; --channel:#9FD3E6; --ink:#E8EEF0; --muted:#9DB0B8;
    --mark:#F27CC0; --line:#2C4552; --panel:#152C38; --btn:#1E3B49; --sky1:#0B1B24; --sky2:#16303D;
  }
}
:root[data-theme="dark"]{
  --paper:#10222C; --shoal:#16465A; --channel:#9FD3E6; --ink:#E8EEF0; --muted:#9DB0B8;
  --mark:#F27CC0; --line:#2C4552; --panel:#152C38; --btn:#1E3B49; --sky1:#0B1B24; --sky2:#16303D;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:Barlow,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.35;display:flex;flex-direction:column;overflow:hidden}
header{padding:6px 10px;border-bottom:1px solid var(--line)}
h1{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:600;font-size:21px;line-height:1.1;margin:0 0 8px;letter-spacing:.01em;display:none}
.seg{display:flex;gap:6px}
.seg button{flex:1;font:inherit;font-weight:500;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:4px;padding:6px 6px;min-height:38px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--channel);color:var(--paper);border-color:var(--channel)}
button:focus-visible,input:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
#stage{flex:1;min-height:0;position:relative;background:linear-gradient(var(--sky1),var(--sky2));touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:12px;top:8px;font-size:13px;color:var(--muted);pointer-events:none}
#fail{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
#bar{display:flex;gap:6px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line)}
#bar button{flex:1;font:inherit;font-weight:500;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:4px;padding:6px 4px;min-height:38px;cursor:pointer}
#bar #more[aria-expanded="true"]{background:var(--channel);color:var(--paper);border-color:var(--channel)}
#panel{background:var(--panel);border-top:1px solid var(--line);padding:10px 14px 12px;max-height:42%;overflow-y:auto}
#panel[hidden]{display:none}
.read{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin:0 0 8px}
.read dt{color:var(--muted)}
.read dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.read dd.key{color:var(--mark)}
.ctl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 10px;margin-top:6px}
.ctl label{color:var(--muted)}
.ctl output{font-weight:600;font-variant-numeric:tabular-nums}
.ctl input{grid-column:1/3;width:100%;accent-color:var(--mark);height:28px;margin:0}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}
@media (min-width:820px){
  h1{display:block}
}
/* canvas fills the whole frame; controls float over it */
body{display:block;min-height:min(75vw,900px)}
h1{display:none !important}
#stage{position:fixed;top:0;left:0;right:0;bottom:0}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:2;border:0;background:transparent;padding:8px 10px}
.seg{max-width:900px;flex-wrap:wrap}
#hint{top:58px}
#bar{position:fixed;bottom:env(safe-area-inset-bottom,0px);left:0;right:0;z-index:2;border:0;background:transparent;padding:8px 10px}
#bar button{max-width:130px}
#panel{position:fixed;left:10px;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:2;width:min(400px,calc(100% - 20px));max-height:55%;border:1px solid var(--line);border-radius:6px}
</style>
</head>
<body>
<header>
  <h1>Boat lift 3D model</h1>
  <div class="seg" role="group" aria-label="Choose a boat">
    <button data-boat="whaler" aria-pressed="true">Whaler 405</button>
    <button data-boat="realm380" aria-pressed="false">Whaler 380 Realm</button>
    <button data-boat="tiara" aria-pressed="false">Tiara 43 LE</button>
    <button data-boat="tiara39ls" aria-pressed="false">Tiara 39 LS</button>
    <button data-boat="aquila" aria-pressed="false">Aquila 36</button>
    <button data-boat="aquila35" aria-pressed="false">Aquila 35S</button>
    <button data-boat="aquila45" aria-pressed="false">Aquila 45S</button>
    <button data-boat="everglades" aria-pressed="false">Everglades 437CX</button>
    <button data-boat="mjm47r" aria-pressed="false">MJM 47R</button>
  </div>
</header>
<div id="stage">
  <div id="hint">Drag to turn. Pinch to zoom. Two fingers to slide.</div>
  <div id="fail">The 3D viewer could not load. Check your connection and reload the page.</div>
</div>
<div id="bar">
  <button id="more" aria-expanded="false" aria-controls="panel">Controls</button>
  <button id="fs">Full screen</button>
</div>
<section id="panel" hidden>
  <dl class="read">
    <dt>Bow to seawall face</dt><dd class="key" id="rClear"></dd>
    <dt>Engines from seawall face</dt><dd id="rEng"></dd>
    <dt>Engines past rear cradle beam</dt><dd id="rOver"></dd>
    <dt>Hardtop above pier deck</dt><dd id="rTop"></dd>
    <dt>Cockpit floor against pier deck</dt><dd id="rSole"></dd>
  </dl>
  <div class="ctl">
    <label for="lift">Keel above mean high water</label><output id="oLift"></output>
    <input id="lift" type="range" min="-2" max="8" step="0.25" value="2">
  </div>
  <div class="ctl">
    <label for="tide">Tide</label><output id="oTide"></output>
    <input id="tide" type="range" min="-0.25" max="1.25" step="0.25" value="1.25">
  </div>
  <p class="note" id="note"></p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  var stage=document.getElementById('stage');
  if(!window.THREE||!THREE.OrbitControls){document.getElementById('fail').style.display='flex';return;}

  // All distances in feet. X runs along the seawall (0 = boat centerline),
  // Z is distance out from the seawall face, Y is elevation (NGVD 1929).
  var MHW=1.25, BOTTOM=-4.25, PIER=7.5, CAP=7.0, PILE_TOP=13.5, MID=30.5, PERSON=5+11/12;
  var BOATS={
    whaler:{tip:2.72,bow:4.26,stern:45.55,eng:47.34,beam:13.47,engines:4,draft:2.0,sB:5.9,sS:3.2,top:10.44,htA:36.63,htB:21.2,sole:0.8,cat:false,
      clear:'2 feet 9 inches',note:'Whaler shown with full fuel and water. Hull, cabin and hardtop are simplified shapes built from the Brunswick dimension sheet; cockpit floor height is estimated.'},
    tiara:{tip:3.54,bow:3.54,stern:47.0,eng:49.95,beam:12.95,engines:2,draft:2.4,sB:5.0,sS:3.5,top:9.6,htA:37.67,htB:19.67,sole:1.0,cat:false,
      clear:'about 3 feet 6 inches',note:'Tiara shown with the center of gravity at 165 inches (the drawing gives 160 to 170). Heights are scaled from the Tiara drawing; cockpit floor height is estimated.'},
    everglades:{tip:2.67,bow:3.5,stern:46.55,eng:49.3,beam:13.25,engines:3,draft:2.5,sB:4.9,sS:3.4,top:9.0,htA:34.5,htB:20.3,sole:1.0,cat:false,
      clear:'about 2 feet 8 inches',note:'Everglades 437CX shown with the center of gravity midway between the lifting strap marks in its owner manual photo. Those positions, the hardtop and the heights are scaled from that photo against the published 46 foot 7 inch length with engines, so treat them as accurate to about a foot. Weight is 33,700 pounds with options, fuel and water.'},
    tiara39ls:{tip:5.12,bow:5.4,stern:42.63,eng:47.64,beam:12.56,engines:2,draft:2.33,sB:4.35,sS:3.2,top:9.62,htA:34.5,htB:20.5,sole:1.0,cat:false,
      clear:'about 5 feet 1 inch',note:'Tiara 39 LS shown at the preliminary center of gravity on its drawing (39LSY-W03-B11666), 145 1/2 inches forward of the transom reference, plus or minus 6 inches. Bow and engine positions are scaled from the drawing against its printed 270 inch dimension; hardtop height is the printed 115 7/16 inch minimum bridge clearance; cockpit floor height is estimated. Published dry weight is 21,339 pounds.'},
    aquila35:{tip:10.18,bow:10.6,stern:41.76,eng:45.69,beam:14.74,engines:2,draft:2.86,sB:4.78,sS:3.5,top:9.4,htA:36.84,htB:21.96,sole:2.2,cat:true,
      clear:'10 feet 2 inches',note:'Aquila 35S shown with the center of gravity on the center of gravity line drawn on its hoisting plan (A35S-FIX-106, revision 1), midway between the slings. Lengths come from the printed dimensions; hardtop position and heights are scaled from the drawing, and the cockpit floor height is estimated. Full load displacement is about 19,960 pounds (published 9,053 kilograms).'},
    aquila45:{tip:2.83,bow:3.9,stern:44.53,eng:50.0,beam:14.97,engines:2,draft:2.8,sB:4.76,sS:3.6,top:9.74,htA:36.16,htB:19.43,sole:2.4,cat:true,
      clear:'2 feet 10 inches',note:'Aquila 45S shown with the center of gravity midway between the slings on its hoisting diagram (A45S-FIX-009, revision 1), which does not mark one. Lengths come from the printed dimensions to the anchor tip; hardtop position is scaled from the drawing and the cockpit floor height is estimated. Full load displacement is about 31,480 pounds.'},
    mjm47r:{tip:2.62,bow:3.61,stern:46.38,eng:50.23,beam:11.65,engines:2,draft:1.95,sB:5.05,sS:3.45,top:9.25,htA:39.51,htB:22.78,sole:1.3,cat:false,detail:true,
      clear:'about 2 feet 7 inches',note:'MJM 47R shown at the center of gravity printed on the MJM 42 outboard lifting diagram (12/9/2022): 15 feet 10 1/2 inches forward of the transom, at 24,515 pounds fully loaded, about 2 feet 1 inch aft of the midpoint between its slings. Bow and engine positions come from the printed lengths and the 17 foot 9 1/2 inch bow roller to sling dimension. The hull profile, cabin, hardtop, bow rail, hull ports, starboard boarding door, anchor and outboards are traced from that drawing, which is marked not to scale. The bow rail ends about 13 inches behind the anchor tip. The transom entry door is not shown on the drawing, so it is not drawn; the hull plan shape and the cockpit floor height are estimated.'},
    realm380:{tip:8.12,bow:8.55,stern:44.07,eng:49.03,beam:11.67,engines:4,draft:2.42,sB:5.0,sS:3.3,top:9.0,htA:38.37,htB:26.42,sole:1.0,cat:false,
      clear:'about 8 feet 1 inch',note:'Whaler 380 Realm shown with the center of gravity midway between the slings in its 2026 owner manual (figure 2.36.1), which gives no center of gravity and no sling dimensions. Sling, bow, transom and engine positions are scaled from that figure against the printed 38 foot hull length; the scaled engine-to-bow length came out at 40 feet 6 inches, matching the printed figure. Hardtop height is the published 9 foot bridge clearance with top; cockpit floor height is estimated. Weight is 23,500 pounds with quad engines, fuel and water.'},
    aquila:{tip:8.45,bow:9.96,stern:45.91,eng:48.2,beam:14.76,engines:2,draft:2.0,sB:4.4,sS:3.0,top:8.45,htA:37.58,htB:19.66,sole:3.0,cat:true,
      clear:'8 feet 5 inches',note:'Aquila shown with the center of gravity halfway between its lifting points. Waterline and deck heights are estimated from the 2017 lifting drawing.'}
  };

  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  stage.insertBefore(renderer.domElement,stage.firstChild);
  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(42,1,0.5,900);
  var controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=0.12; controls.maxPolarAngle=Math.PI*0.52;
  controls.minDistance=8; controls.maxDistance=260;
  scene.add(new THREE.HemisphereLight(0xffffff,0x6f7f86,0.95));
  var sun=new THREE.DirectionalLight(0xffffff,0.75); sun.position.set(60,90,80); scene.add(sun);

  function mat(c,o){var m=new THREE.MeshLambertMaterial({color:c,side:THREE.DoubleSide});if(o!==undefined){m.transparent=true;m.opacity=o;m.depthWrite=false;}return m;}
  var M={wood:mat(0x9A7B55),conc:mat(0xB9B6AC),land:mat(0xE2D5A6),sand:mat(0xC9BC8F),water:mat(0x3F8FA6,0.55),
    hull:mat(0xF7F7F4),bottom:mat(0x1D3F5C),deck:mat(0xDAD3C2),glass:mat(0x24343C,0.6),top:mat(0xECECE8),
    eng:mat(0x23282B),steel:mat(0x8D979C),a:mat(0xA8136F),b:mat(0xE0862A)};
  M.glass.side=THREE.FrontSide;
  var MARK=0xA8136F; M.mark=new THREE.MeshBasicMaterial({color:0x12A150,side:THREE.DoubleSide}); M.over=new THREE.MeshBasicMaterial({color:0x1F5FD0});

  function box(g,m,x0,x1,y0,y1,z0,z1){
    var me=new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x1-x0),Math.abs(y1-y0),Math.abs(z1-z0)),m);
    me.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2); g.add(me); return me;
  }
  function line(g,pts,color){
    var geo=new THREE.BufferGeometry().setFromPoints(pts.map(function(p){return new THREE.Vector3(p[0],p[1],p[2]);}));
    var l=new THREE.Line(geo,new THREE.LineBasicMaterial({color:color})); g.add(l); return l;
  }
  function label(g,text,x,y,z,w,col){ col=col||'#A8136F';
    var c=document.createElement('canvas'); c.width=512; c.height=96;
    var k=c.getContext('2d'); k.fillStyle='rgba(251,246,230,0.92)'; k.fillRect(0,0,512,96);
    k.strokeStyle=col; k.lineWidth=4; k.strokeRect(2,2,508,92);
    k.fillStyle=col; var fs=40; do{k.font='600 '+fs+'px "Barlow Condensed","Arial Narrow",Arial,sans-serif'; fs-=2;}while(k.measureText(text).width>484&&fs>16); k.textAlign='center'; k.textBaseline='middle';
    k.fillText(text,256,50);
    var s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));
    s.scale.set(w,w*96/512,1); s.position.set(x,y,z); s.renderOrder=10; g.add(s); return s;
  }
  function person(g,m,x,y,z){
    var p=new THREE.Group(), H=PERSON;
    [-0.25,0.25].forEach(function(dx){var leg=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.17,2.85,10),m);leg.position.set(dx,1.425,0);p.add(leg);});
    var torso=new THREE.Mesh(new THREE.BoxGeometry(1.0,2.0,0.55),m); torso.position.y=3.85; p.add(torso);
    [-0.64,0.64].forEach(function(dx){var arm=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.11,2.1,8),m);arm.position.set(dx,3.75,0);p.add(arm);});
    var neck=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.4,8),m); neck.position.y=5.0; p.add(neck);
    var head=new THREE.Mesh(new THREE.SphereGeometry(0.38,14,10),m); head.position.y=H-0.38; p.add(head);
    p.position.set(x,y,z); g.add(p); return p;
  }

  // ---------- fixed site ----------
  var site=new THREE.Group(); scene.add(site);
  box(site,M.sand,-110,140,BOTTOM-1,BOTTOM,-2.5,170);
  box(site,M.land,-110,140,BOTTOM-1,CAP,-70,-2.5);
  box(site,M.conc,-35.08,64.92,BOTTOM,CAP,-2.5,0);
  box(site,M.wood,9.5,48.92,CAP-0.1,PIER,0,5);            // viewing platform that stays
  box(site,M.wood,9.5,13.5,PIER-0.6,PIER,5,40);           // finger pier, 4 feet wide, 40 feet from the seawall face with the platform strip
  [8,18,28,38].forEach(function(z){[9.9,13.1].forEach(function(x){box(site,M.conc,x-0.4,x+0.4,BOTTOM,PIER-0.6,z-0.4,z+0.4);});});
  [14,24,34,44].forEach(function(x){box(site,M.conc,x-0.4,x+0.4,BOTTOM,CAP-0.1,3.6,4.4);});
  for(var rz=5;rz<=40;rz+=5){box(site,M.steel,13.3,13.45,PIER,PIER+3,rz-0.07,rz+0.07);}
  box(site,M.steel,13.3,13.45,PIER+2.9,PIER+3,5,40);       // 36 inch railing
  [[-9,21.5],[9,21.5],[-9,39.5],[9,39.5]].forEach(function(p){box(site,M.conc,p[0]-0.5,p[0]+0.5,BOTTOM,PILE_TOP,p[1]-0.5,p[1]+0.5);});
  [-9,9].forEach(function(x){box(site,M.steel,x-0.45,x+0.45,PILE_TOP,PILE_TOP+0.9,20.5,40.5);box(site,M.eng,x-0.6,x+0.6,PILE_TOP+0.9,PILE_TOP+1.9,38.6,40.4);box(site,M.eng,x-0.6,x+0.6,PILE_TOP+0.9,PILE_TOP+1.9,20.6,22.4);});
  line(site,[[-17,PILE_TOP+1,MID],[9,PILE_TOP+1,MID]],MARK);
  label(site,'Lift midpoint 30 feet 6 inches',-17,PILE_TOP+2.5,MID,13);
  label(site,'Seawall face',-22,CAP+2,0,7);
  label(site,'North',-30,4,52,5);
  // dashed triangle from the Trident site plan: 45 degree lines from each property corner, meeting 50 feet out
  M.tri=new THREE.MeshBasicMaterial({color:0x0E6E8C});
  function dashes(x0,z0,x1,z1,y){var L=Math.hypot(x1-x0,z1-z0),n=Math.floor(L/3),ux=(x1-x0)/L,uz=(z1-z0)/L,ang=Math.atan2(ux,uz);
    for(var i=0;i<n;i++){var s=i*3+1,m=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.12,2),M.tri);m.position.set(x0+ux*s,y,z0+uz*s);m.rotation.y=ang;site.add(m);}}
  dashes(64.92,0.3,14.92,50,CAP+0.2); dashes(-35.08,0.3,14.92,50,CAP+0.2);
  label(site,'45 degree lines from property corners',14.92,CAP+2.4,51.5,13,'#0E6E8C');
  person(site,M.a,11.5,PIER,31).rotation.y=Math.PI/2;

  // ---------- boat ----------
  function rad(d){return d*Math.PI/180;}
  function stations(b,beam,deckless){
    var N=30,out=[];
    for(var i=0;i<=N;i++){
      var t=i/N, z=b.stern+(b.bow-b.stern)*t;
      var f=t<0.5?1:Math.sqrt(Math.max(0,1-Math.pow((t-0.5)/0.5,2.4)));
      f*=0.93+0.07*Math.min(1,t/0.15);
      var hb=Math.max(0.04,beam/2*f);
      var sh=b.sS+(b.sB-b.sS)*Math.pow(t,1.4);
      var k=t<0.6?-b.draft:-b.draft+(b.draft+sh*0.55)*Math.pow((t-0.6)/0.4,2.2);
      var cx=0.82*hb, ch=Math.min(sh-0.4,k+cx*Math.tan(rad(18+22*t)));
      out.push({t:t,z:z,hb:hb,sh:sh,k:k,cx:cx,ch:ch});
    }
    return out;
  }
  function geo(tris){var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(tris,3));g.computeVertexNormals();return g;}
  function quad(a,p,q,r,s){a.push(p[0],p[1],p[2],q[0],q[1],q[2],r[0],r[1],r[2],p[0],p[1],p[2],r[0],r[1],r[2],s[0],s[1],s[2]);}
  function tri(a,p,q,r){a.push(p[0],p[1],p[2],q[0],q[1],q[2],r[0],r[1],r[2]);}
  function hull(g,b,beam,xo,tc,decked){
    var S=stations(b,beam), bot=[], side=[], dk=[];
    for(var i=0;i<S.length-1;i++){
      var A=S[i],B=S[i+1];
      [-1,1].forEach(function(s){
        quad(bot,[xo,A.k,A.z],[xo+s*A.cx,A.ch,A.z],[xo+s*B.cx,B.ch,B.z],[xo,B.k,B.z]);
        quad(side,[xo+s*A.cx,A.ch,A.z],[xo+s*A.hb,A.sh,A.z],[xo+s*B.hb,B.sh,B.z],[xo+s*B.cx,B.ch,B.z]);
      });
      if(decked){
        if(A.t>=tc){quad(dk,[xo-A.hb,A.sh,A.z],[xo+A.hb,A.sh,A.z],[xo+B.hb,B.sh,B.z],[xo-B.hb,B.sh,B.z]);}
        else{var ia=Math.max(0.1,A.hb-0.5),ib=Math.max(0.1,B.hb-0.5);
          quad(dk,[xo-ia,b.sole,A.z],[xo+ia,b.sole,A.z],[xo+ib,b.sole,B.z],[xo-ib,b.sole,B.z]);
          if(B.t>=tc){quad(dk,[xo-B.hb,b.sole,B.z],[xo+B.hb,b.sole,B.z],[xo+B.hb,B.sh,B.z],[xo-B.hb,B.sh,B.z]);}
        }
      }
    }
    var T=S[0];

    [REAR,b.eng].forEach(function(z){box(dyn,M.over,ox-0.9,ox+0.9,oy-0.07,oy+0.07,z-0.07,z+0.07);box(dyn,M.over,ox-0.07,ox+0.07,oy-1.6,oy+0.07,z-0.07,z+0.07);});
    label(dyn,'Stern overhang '+feet(over),ox-1.5,oy+2.0,(REAR+b.eng)/2,12,'#1F5FD0');
    document.getElementById('rOver').textContent=feet(over);
    var my=wl+b.sB+0.6;
    line(dyn,[[0,my,0],[0,my,b.tip]],MARK);
    line(dyn,[[-1,my,0],[1,my,0]],MARK); line(dyn,[[-1,my,b.tip],[1,my,b.tip]],MARK);
    label(dyn,'Bow clearance '+b.clear,0,my+2.2,b.tip/2,13);

    document.getElementById('rClear').textContent=b.clear;
    document.getElementById('rEng').textContent=feet(b.eng);
    document.getElementById('rTop').textContent=signed(wl+b.top-PIER,'above','below');
    document.getElementById('rSole').textContent=signed(wl+b.sole-PIER,'above','below');
    document.getElementById('oLift').textContent=(liftV<0?'minus ':'')+feet(Math.abs(liftV));
    document.getElementById('oTide').textContent=tide>=1.25?'Mean high water':tide<=-0.25?'Mean low water':feet(1.25-tide)+' below high';
    document.getElementById('note').textContent=b.note+' The finger pier is 4 feet wide and runs 40 feet out from the seawall face. Pier deck is at 7 feet 6 inches and lift piles top out 6 feet above it, per the Trident sections. The lift is drawn as a four motor top beam cradle lift, one motor per pile. Each figure is 5 feet 11 inches tall.';
    state={wl:wl,b:b};
  }
  var state={};
  function feet(v){var tot=Math.round(v*12),f=Math.floor(tot/12),i=tot%12;return (f?f+(f===1?' foot':' feet'):'')+(f&&i?' ':'')+(i||!f?i+(i===1?' inch':' inches'):'');}
  function signed(v,up,down){return Math.abs(v)<0.04?'level':feet(Math.abs(v))+' '+(v>0?up:down);}

  function view(name){
    var t=new THREE.Vector3(0,5,27), p;
    if(name==='top'){p=new THREE.Vector3(0,118,26.99);}
    else if(name==='side'){p=new THREE.Vector3(-78,10,27);}
    else if(name==='pier'){t.set(-2,(state.wl||5)+3,27);p=new THREE.Vector3(11.5,PIER+PERSON-0.4,36);}
    else{p=new THREE.Vector3(-50,34,74);}
    controls.target.copy(t); camera.position.copy(p); controls.update();
  }
  function size(){var w=stage.clientWidth,h=stage.clientHeight;if(!w||!h){return;}renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
  if(window.ResizeObserver){new ResizeObserver(size).observe(stage);}else{window.addEventListener('resize',size);}

  document.querySelectorAll('[data-boat]').forEach(function(btn){btn.addEventListener('click',function(){
    current=btn.getAttribute('data-boat');
    document.querySelectorAll('[data-boat]').forEach(function(o){o.setAttribute('aria-pressed',o===btn?'true':'false');});
    build();
  });});
  document.querySelectorAll('[data-view]').forEach(function(btn){btn.addEventListener('click',function(){view(btn.getAttribute('data-view'));});});
  document.getElementById('lift').addEventListener('input',build);
  document.getElementById('tide').addEventListener('input',build);
  renderer.domElement.addEventListener('pointerdown',function(){document.getElementById('hint').style.display='none';},{once:true});

  var more=document.getElementById('more'),panel=document.getElementById('panel');
  more.addEventListener('click',function(){var open=panel.hidden;panel.hidden=!open;more.setAttribute('aria-expanded',open?'true':'false');});
  var fs=document.getElementById('fs'),de=document.documentElement;
  var reqFs=de.requestFullscreen||de.webkitRequestFullscreen, exitFs=document.exitFullscreen||document.webkitExitFullscreen;
  if(!reqFs||!(document.fullscreenEnabled||document.webkitFullscreenEnabled)){fs.style.display='none';}
  else{fs.addEventListener('click',function(){
    var on=document.fullscreenElement||document.webkitFullscreenElement;
    try{var r=on?exitFs.call(document):reqFs.call(de);if(r&&r.catch){r.catch(function(){fs.style.display='none';});}}catch(e){fs.style.display='none';}
  });}
  size(); build(); view('orbit');
  (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();
})();
</script>
</body>
</html>
